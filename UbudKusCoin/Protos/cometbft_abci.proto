syntax = "proto3";

package tendermint.abci;
option csharp_namespace = "UbudKusCoin.CometBft.Abci";

import "google/protobuf/timestamp.proto";

// Application-owned adaptation of CometBFT v0.38.17 ABCI types. The upstream
// schema is Apache-2.0 licensed; see /THIRD-PARTY-NOTICES.md. Unused nested types are
// intentionally omitted until the corresponding application feature exists.
service ABCI {
  rpc Echo(RequestEcho) returns (ResponseEcho);
  rpc Flush(RequestFlush) returns (ResponseFlush);
  rpc Info(RequestInfo) returns (ResponseInfo);
  rpc CheckTx(RequestCheckTx) returns (ResponseCheckTx);
  rpc Query(RequestQuery) returns (ResponseQuery);
  rpc Commit(RequestCommit) returns (ResponseCommit);
  rpc InitChain(RequestInitChain) returns (ResponseInitChain);
  rpc ListSnapshots(RequestListSnapshots) returns (ResponseListSnapshots);
  rpc OfferSnapshot(RequestOfferSnapshot) returns (ResponseOfferSnapshot);
  rpc LoadSnapshotChunk(RequestLoadSnapshotChunk) returns (ResponseLoadSnapshotChunk);
  rpc ApplySnapshotChunk(RequestApplySnapshotChunk) returns (ResponseApplySnapshotChunk);
  rpc PrepareProposal(RequestPrepareProposal) returns (ResponsePrepareProposal);
  rpc ProcessProposal(RequestProcessProposal) returns (ResponseProcessProposal);
  rpc ExtendVote(RequestExtendVote) returns (ResponseExtendVote);
  rpc VerifyVoteExtension(RequestVerifyVoteExtension) returns (ResponseVerifyVoteExtension);
  rpc FinalizeBlock(RequestFinalizeBlock) returns (ResponseFinalizeBlock);
}

message Request {
  oneof value {
    RequestEcho echo = 1;
    RequestFlush flush = 2;
    RequestInfo info = 3;
    RequestInitChain init_chain = 5;
    RequestQuery query = 6;
    RequestCheckTx check_tx = 8;
    RequestCommit commit = 11;
    RequestListSnapshots list_snapshots = 12;
    RequestOfferSnapshot offer_snapshot = 13;
    RequestLoadSnapshotChunk load_snapshot_chunk = 14;
    RequestApplySnapshotChunk apply_snapshot_chunk = 15;
    RequestPrepareProposal prepare_proposal = 16;
    RequestProcessProposal process_proposal = 17;
    RequestExtendVote extend_vote = 18;
    RequestVerifyVoteExtension verify_vote_extension = 19;
    RequestFinalizeBlock finalize_block = 20;
  }
}

message Response {
  oneof value {
    ResponseException exception = 1;
    ResponseEcho echo = 2;
    ResponseFlush flush = 3;
    ResponseInfo info = 4;
    ResponseInitChain init_chain = 6;
    ResponseQuery query = 7;
    ResponseCheckTx check_tx = 9;
    ResponseCommit commit = 12;
    ResponseListSnapshots list_snapshots = 13;
    ResponseOfferSnapshot offer_snapshot = 14;
    ResponseLoadSnapshotChunk load_snapshot_chunk = 15;
    ResponseApplySnapshotChunk apply_snapshot_chunk = 16;
    ResponsePrepareProposal prepare_proposal = 17;
    ResponseProcessProposal process_proposal = 18;
    ResponseExtendVote extend_vote = 19;
    ResponseVerifyVoteExtension verify_vote_extension = 20;
    ResponseFinalizeBlock finalize_block = 21;
  }
}
message ResponseException { string error = 1; }

message RequestEcho { string message = 1; }
message ResponseEcho { string message = 1; }
message RequestFlush {}
message ResponseFlush {}
message RequestInfo { string version = 1; uint64 block_version = 2; uint64 p2p_version = 3; string abci_version = 4; }
message ResponseInfo { string data = 1; string version = 2; uint64 app_version = 3; int64 last_block_height = 4; bytes last_block_app_hash = 5; }
message RequestCheckTx { bytes tx = 1; int32 type = 2; }
message ResponseCheckTx { uint32 code = 1; bytes data = 2; string log = 3; string info = 4; int64 gas_wanted = 5; int64 gas_used = 6; string codespace = 8; }
message RequestQuery { bytes data = 1; string path = 2; int64 height = 3; bool prove = 4; }
message ResponseQuery { uint32 code = 1; string log = 3; string info = 4; int64 index = 5; bytes key = 6; bytes value = 7; int64 height = 9; string codespace = 10; }
message RequestCommit {}
message ResponseCommit { int64 retain_height = 3; }
message RequestInitChain { google.protobuf.Timestamp time = 1; string chain_id = 2; repeated ValidatorUpdate validators = 4; bytes app_state_bytes = 5; int64 initial_height = 6; }
message ResponseInitChain { repeated ValidatorUpdate validators = 2; bytes app_hash = 3; }
message ValidatorUpdate { PublicKey pub_key = 1; int64 power = 2; }
message PublicKey { oneof sum { bytes ed25519 = 1; bytes secp256k1 = 2; } }
message RequestListSnapshots {}
message ResponseListSnapshots {}
message RequestOfferSnapshot { bytes app_hash = 2; }
message ResponseOfferSnapshot { int32 result = 1; }
message RequestLoadSnapshotChunk { uint64 height = 1; uint32 format = 2; uint32 chunk = 3; }
message ResponseLoadSnapshotChunk { bytes chunk = 1; }
message RequestApplySnapshotChunk { uint32 index = 1; bytes chunk = 2; string sender = 3; }
message ResponseApplySnapshotChunk { int32 result = 1; repeated uint32 refetch_chunks = 2; repeated string reject_senders = 3; }

message RequestPrepareProposal {
  int64 max_tx_bytes = 1;
  repeated bytes txs = 2;
  int64 height = 5;
  google.protobuf.Timestamp time = 6;
  bytes proposer_address = 8;
}
message ResponsePrepareProposal { repeated bytes txs = 1; }
message RequestProcessProposal {
  repeated bytes txs = 1;
  bytes hash = 4;
  int64 height = 5;
  google.protobuf.Timestamp time = 6;
  bytes proposer_address = 8;
}
message ResponseProcessProposal {
  enum ProposalStatus { UNKNOWN = 0; ACCEPT = 1; REJECT = 2; }
  ProposalStatus status = 1;
}
message RequestExtendVote { bytes hash = 1; int64 height = 2; }
message ResponseExtendVote { bytes vote_extension = 1; }
message RequestVerifyVoteExtension { bytes hash = 1; bytes validator_address = 2; int64 height = 3; bytes vote_extension = 4; }
message ResponseVerifyVoteExtension { enum VerifyStatus { UNKNOWN = 0; ACCEPT = 1; REJECT = 2; } VerifyStatus status = 1; }
message RequestFinalizeBlock {
  repeated bytes txs = 1;
  repeated Misbehavior misbehavior = 3;
  bytes hash = 4;
  int64 height = 5;
  google.protobuf.Timestamp time = 6;
  bytes proposer_address = 8;
}
enum MisbehaviorType {
  MISBEHAVIOR_UNKNOWN = 0;
  DUPLICATE_VOTE = 1;
  LIGHT_CLIENT_ATTACK = 2;
}
message Misbehavior {
  MisbehaviorType type = 1;
  Validator validator = 2;
  int64 height = 3;
  google.protobuf.Timestamp time = 4;
  int64 total_voting_power = 5;
}
message Validator { bytes address = 1; int64 power = 3; }
message ResponseFinalizeBlock {
  repeated ExecTxResult tx_results = 2;
  repeated ValidatorUpdate validator_updates = 3;
  bytes app_hash = 5;
}
message ExecTxResult { uint32 code = 1; bytes data = 2; string log = 3; string info = 4; int64 gas_wanted = 5; int64 gas_used = 6; string codespace = 8; }
