name: UbudKusCoin CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore UbudKusCoin.sln

      - name: Build Solution
        run: dotnet build UbudKusCoin.sln -c Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test UbudKusCoin.sln -c Release --no-build --nologo --verbosity normal
