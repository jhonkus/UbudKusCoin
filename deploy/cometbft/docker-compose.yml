services:
  cometbft-init:
    image: cometbft/cometbft:v0.38.17
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ ! -f /cometbft/config/genesis.json ]; then cometbft init --home /cometbft && sed -i -e 's/\\\"chain_id\\\": \\\"[^\\\"]*\\\"/\\\"chain_id\\\": \\\"ukc-testnet-2\\\"/' -e 's/\\\"initial_height\\\": \\\"0\\\"/\\\"initial_height\\\": \\\"1\\\"/' -e 's/\\\"app_hash\\\": \\\"\\\"/\\\"app_hash\\\": \\\"7cd27abd68161f3d9662420a4cf0643f97926b058084ab50c0fd9daf6bbf6c4e\\\"/' /cometbft/config/genesis.json; fi"]
    volumes:
      - cometbft-data:/cometbft

  ukc-app:
    build:
      context: ../..
      dockerfile: deploy/cometbft/Dockerfile
    environment:
      NODE_PASSPHRASE: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
      CHAIN_ID: "2"
      CONSENSUS_ENGINE: "cometbft"
      COMETBFT_RPC_URL: "http://cometbft:26657"
      COMETBFT_CHAIN_ID: "ukc-testnet-2"
      COMETBFT_STARTUP_TIMEOUT_SECONDS: "120"
      ABCI_SOCKET_PORT: "26658"
      COMETBFT_HOME: "/cometbft"
      GRPC_PORT: "5000"
      GRPC_WEB_PORT: "5001"
      NODE_ADDRESS: "ukc-app:5000"
      BOOTSRTAP_PEERS: ""
      GENESIS_MANIFEST_PATH: "/app/genesis-manifest.json"
      GENESIS_MANIFEST_SHA256: "AB23BDF1F4BDAD384C616338C446ED950AF2702AB763F0FEE76B82BEFEAF9533"
      VALIDATOR_KEY_CUSTODY_MODE: "local-file"
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ukc-db:/app/DbFiles
      - ./genesis-manifest.testnet.json:/app/genesis-manifest.json:ro
      - cometbft-data:/cometbft:ro
    depends_on:
      cometbft-init:
        condition: service_completed_successfully

  cometbft:
    image: cometbft/cometbft:v0.38.17
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      cometbft-init:
        condition: service_completed_successfully
      ukc-app:
        condition: service_started
    command: ["cometbft node --home /cometbft --proxy_app=tcp://ukc-app:26658 --rpc.laddr=tcp://0.0.0.0:26657"]
    ports:
      - "26657:26657"
    volumes:
      - cometbft-data:/cometbft

volumes:
  ukc-db:
  cometbft-data:
